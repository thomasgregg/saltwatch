substitutions:
  project_version: "2.1.0"
  sensor_min_cm: "5.0"
  sensor_max_cm: "120.0"
  minimum_calibration_span_cm: "10.0"
  measurement_timeout_ms: "180000"
  invalid_reading_limit: "3"
  low_salt_hysteresis_percent: "5.0"
  forecast_daily_history_size: "28"
  forecast_minimum_days: "6.0"
  forecast_minimum_decline_percent: "2.0"
  forecast_minimum_rate_per_day: "0.05"
  forecast_maximum_mad_percent: "4.0"
  forecast_refill_candidate_percent: "8.0"
  forecast_refill_confirmation_percent: "6.0"

esphome:
  name: saltwatch
  friendly_name: SaltWatch
  name_add_mac_suffix: true
  project:
    name: saltwatch.salt-monitor
    version: "${project_version}"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            ESP_LOGI("saltwatch", "SaltWatch firmware ${project_version} starting");
    - priority: -100
      then:
        - delay: 3s
        - lambda: |-
            if (id(tof_distance).is_failed()) {
              ESP_LOGE("sensor", "VL53L0X unavailable on I2C address 0x29");
            } else {
              ESP_LOGI("sensor", "VL53L0X detected on I2C address 0x29");
            }
        - script.execute: forecast_recalculate_model
        - script.wait: forecast_recalculate_model
        - script.execute: forecast_publish_refill_timestamp
        - script.execute: evaluate_state

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

preferences:
  # Calibration changes are rare and should survive an immediate power loss.
  flash_write_interval: 1s

logger:
  level: INFO
  baud_rate: 115200

# Credential-free network defaults shared by manual and dashboard-adopted builds.
# The entry-point YAML supplies credentials and the API encryption key.
wifi:
  reboot_timeout: 0s

api:
  id: saltwatch_api
  reboot_timeout: 0s

# Intentionally open on the local network. Keep the device on a trusted LAN.
web_server:
  port: 80
  version: 2
  local: true
  compression: gzip
  log: false

ota:
  - platform: esphome
    id: saltwatch_ota
  - platform: web_server
    id: saltwatch_web_ota

i2c:
  sda: GPIO26
  scl: GPIO32
  scan: true

# Forecast learning uses Home Assistant's clock for durable daily timestamps.
# Core sensing, calibration, fault handling, and an already learned forecast do
# not depend on a live Home Assistant connection.
time:
  - platform: homeassistant
    id: homeassistant_time
    # Fixed UTC makes aggregation identical for public and locally compiled
    # firmware and avoids daylight-saving buckets with unequal duration.
    timezone: UTC0
    on_time:
      - seconds: 0
        minutes: 0
        hours: "0,6,12,18"
        then:
          - script.execute: forecast_finalize_bucket
    on_time_sync:
      then:
        - script.execute: forecast_publish_refill_timestamp

globals:
  - id: full_calibration_completed
    type: bool
    restore_value: true
    initial_value: "false"

  - id: empty_calibration_completed
    type: bool
    restore_value: true
    initial_value: "false"

  - id: has_valid_measurement
    type: bool
    restore_value: false
    initial_value: "false"

  - id: last_valid_measurement_ms
    type: uint64_t
    restore_value: false
    initial_value: "0"

  - id: consecutive_invalid_readings
    type: int
    restore_value: false
    initial_value: "0"

  - id: calibration_was_valid
    type: bool
    restore_value: false
    initial_value: "false"

  - id: i2c_missing_observed
    type: bool
    restore_value: false
    initial_value: "false"

  # Prevent a permanently blocked/present sensor from causing a reboot loop.
  # A new valid measurement or a confirmed physical disconnect permits one
  # future recovery reboot.
  - id: sensor_recovery_reboot_attempted
    type: bool
    restore_value: true
    initial_value: "false"

  - id: sensor_recovery_reboot_requested
    type: bool
    restore_value: false
    initial_value: "false"

  # Device-native forecasting stores only 28 daily aggregates plus compact
  # completed-cycle statistics. It never stores the 30-second measurements.
  - id: forecast_daily_levels
    type: "std::array<float, ${forecast_daily_history_size}>"
    restore_value: true
    initial_value: "std::array<float, ${forecast_daily_history_size}>{}"

  - id: forecast_daily_days
    type: "std::array<int32_t, ${forecast_daily_history_size}>"
    restore_value: true
    initial_value: "std::array<int32_t, ${forecast_daily_history_size}>{}"

  - id: forecast_daily_count
    type: int
    restore_value: true
    initial_value: "0"

  - id: forecast_recent_buckets
    type: "std::array<float, 4>"
    restore_value: true
    initial_value: "std::array<float, 4>{}"

  - id: forecast_recent_bucket_count
    type: int
    restore_value: true
    initial_value: "0"

  - id: forecast_day_sum
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: forecast_day_bucket_count
    type: int
    restore_value: true
    initial_value: "0"

  - id: forecast_day_key
    type: int32_t
    restore_value: true
    initial_value: "-1"

  - id: forecast_refill_candidate
    type: bool
    restore_value: true
    initial_value: "false"

  - id: forecast_refill_base
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: forecast_refill_candidate_level
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: forecast_refill_candidate_day
    type: int32_t
    restore_value: true
    initial_value: "-1"

  # Lowest accepted six-hour level in the current usage cycle. Comparing a
  # candidate with this floor also catches a refill spread across several
  # buckets instead of only a single abrupt jump.
  - id: forecast_cycle_low_level
    type: float
    restore_value: true
    initial_value: "101.0"

  - id: forecast_historical_rate
    type: float
    restore_value: true
    initial_value: "-1.0"

  - id: forecast_historical_variance
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: forecast_completed_cycles
    type: int
    restore_value: true
    initial_value: "0"

  # Zero means that no refill has been recorded. Minus one means a refill was
  # accepted while the Home Assistant clock was unavailable and should be
  # timestamped at the next successful time synchronization.
  - id: last_recorded_refill_timestamp
    type: int64_t
    restore_value: true
    initial_value: "0"

  - id: refill_timestamp_publish_requested
    type: bool
    restore_value: false
    initial_value: "false"

  - id: forecast_calibration_full_tenths
    type: int
    restore_value: true
    initial_value: "0"

  - id: forecast_calibration_empty_tenths
    type: int
    restore_value: true
    initial_value: "0"

  # Six-hour input accumulation is deliberately RAM-only. A restart discards
  # an incomplete bucket rather than creating a misleading cross-reboot rate.
  - id: forecast_bucket_sum
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: forecast_bucket_sample_count
    type: int
    restore_value: false
    initial_value: "0"

  - id: forecast_current_rate
    type: float
    restore_value: false
    initial_value: "-1.0"

  - id: forecast_current_days
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: forecast_current_decline
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: forecast_current_mad
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: forecast_current_model_valid
    type: bool
    restore_value: false
    initial_value: "false"

  - id: forecast_reset_requested
    type: bool
    restore_value: false
    initial_value: "false"

  - id: forecast_was_available
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: forecast_publish_refill_timestamp
    mode: restart
    then:
      - lambda: |-
          constexpr int64_t earliest_sane_timestamp = 946684800LL;   // 2000-01-01
          constexpr int64_t latest_sane_timestamp = 4102444800LL;   // 2100-01-01

          int64_t stored = id(last_recorded_refill_timestamp);
          if (stored == -1) {
            const auto now = id(homeassistant_time).now();
            if (!now.is_valid()) {
              id(last_recorded_refill).publish_state(NAN);
              ESP_LOGW("forecast",
                       "Refill accepted; timestamp waiting for Home Assistant time");
              return;
            }
            stored = static_cast<int64_t>(now.timestamp);
            id(last_recorded_refill_timestamp) = stored;
            ESP_LOGI("forecast", "Recorded refill timestamp");
          }

          if (stored == 0) {
            id(last_recorded_refill).publish_state(NAN);
            return;
          }
          if (stored < earliest_sane_timestamp ||
              stored > latest_sane_timestamp) {
            ESP_LOGW("forecast", "Discarded invalid restored refill timestamp");
            id(last_recorded_refill_timestamp) = 0;
            id(last_recorded_refill).publish_state(NAN);
            return;
          }

          const float published = static_cast<float>(stored);
          if (!id(last_recorded_refill).has_state() ||
              !std::isfinite(id(last_recorded_refill).state) ||
              id(last_recorded_refill).state != published) {
            id(last_recorded_refill).publish_state(published);
          }

  - id: forecast_reset_learning
    mode: restart
    then:
      - lambda: |-
          id(forecast_daily_levels).fill(0.0f);
          id(forecast_daily_days).fill(0);
          id(forecast_daily_count) = 0;
          id(forecast_recent_buckets).fill(0.0f);
          id(forecast_recent_bucket_count) = 0;
          id(forecast_day_sum) = 0.0f;
          id(forecast_day_bucket_count) = 0;
          id(forecast_day_key) = -1;
          id(forecast_refill_candidate) = false;
          id(forecast_refill_base) = 0.0f;
          id(forecast_refill_candidate_level) = 0.0f;
          id(forecast_refill_candidate_day) = -1;
          id(forecast_cycle_low_level) = 101.0f;
          id(forecast_historical_rate) = -1.0f;
          id(forecast_historical_variance) = 0.0f;
          id(forecast_completed_cycles) = 0;
          id(forecast_bucket_sum) = 0.0f;
          id(forecast_bucket_sample_count) = 0;
          id(forecast_current_rate) = -1.0f;
          id(forecast_current_days) = 0.0f;
          id(forecast_current_decline) = 0.0f;
          id(forecast_current_mad) = 0.0f;
          id(forecast_current_model_valid) = false;
          ESP_LOGI("forecast", "Forecast learning reset because calibration changed");
      - script.execute: forecast_evaluate

  - id: forecast_recalculate_model
    mode: restart
    then:
      - lambda: |-
          int n = std::max(
              0, std::min(id(forecast_daily_count), ${forecast_daily_history_size}));

          // Restored values are treated as untrusted input. A power loss can
          // interrupt independent preference writes, so keep only the valid,
          // strictly ordered prefix rather than fitting a model to corruption.
          int valid_count = 0;
          for (int i = 0; i < n; i++) {
            const float level = id(forecast_daily_levels)[i];
            const int32_t day = id(forecast_daily_days)[i];
            if (!std::isfinite(level) || level < 0.0f || level > 100.0f ||
                day <= 0 ||
                (i > 0 && day <= id(forecast_daily_days)[i - 1])) {
              break;
            }
            valid_count++;
          }
          if (valid_count != id(forecast_daily_count)) {
            ESP_LOGW("forecast",
                     "Discarded inconsistent restored forecast samples");
            id(forecast_daily_count) = valid_count;
          }
          n = valid_count;

          const bool history_valid =
              std::isfinite(id(forecast_historical_rate)) &&
              id(forecast_historical_rate) >=
                  ${forecast_minimum_rate_per_day} &&
              id(forecast_historical_rate) <= 100.0f &&
              std::isfinite(id(forecast_historical_variance)) &&
              id(forecast_historical_variance) >= 0.0f &&
              id(forecast_historical_variance) <= 10000.0f &&
              id(forecast_completed_cycles) >= 0 &&
              id(forecast_completed_cycles) <= 1000;
          if (id(forecast_historical_rate) >=
                  ${forecast_minimum_rate_per_day} &&
              !history_valid) {
            ESP_LOGW("forecast", "Discarded inconsistent historical forecast");
            id(forecast_historical_rate) = -1.0f;
            id(forecast_historical_variance) = 0.0f;
            id(forecast_completed_cycles) = 0;
          }

          int recent_count = std::max(
              0, std::min(id(forecast_recent_bucket_count), 4));
          bool recent_valid = recent_count == id(forecast_recent_bucket_count);
          for (int i = 0; i < recent_count; i++) {
            const float level = id(forecast_recent_buckets)[i];
            recent_valid = recent_valid && std::isfinite(level) &&
                           level >= 0.0f && level <= 100.0f;
          }
          if (!recent_valid) {
            ESP_LOGW("forecast", "Discarded inconsistent recent forecast state");
            id(forecast_recent_buckets).fill(0.0f);
            id(forecast_recent_bucket_count) = 0;
            id(forecast_refill_candidate) = false;
            id(forecast_refill_candidate_day) = -1;
            id(forecast_cycle_low_level) = 101.0f;
          } else {
            id(forecast_recent_bucket_count) = recent_count;
          }

          if (!std::isfinite(id(forecast_cycle_low_level)) ||
              id(forecast_cycle_low_level) < 0.0f ||
              id(forecast_cycle_low_level) > 101.0f) {
            id(forecast_cycle_low_level) = 101.0f;
          }
          const bool candidate_state_valid =
              !id(forecast_refill_candidate) ||
              (std::isfinite(id(forecast_refill_base)) &&
               id(forecast_refill_base) >= 0.0f &&
               id(forecast_refill_base) <= 100.0f &&
               std::isfinite(id(forecast_refill_candidate_level)) &&
               id(forecast_refill_candidate_level) >= 0.0f &&
               id(forecast_refill_candidate_level) <= 100.0f &&
               id(forecast_refill_candidate_day) > 0);
          if (!candidate_state_valid) {
            ESP_LOGW("forecast", "Discarded inconsistent refill candidate");
            id(forecast_refill_candidate) = false;
            id(forecast_refill_candidate_day) = -1;
          }

          const bool partial_day_valid =
              id(forecast_day_bucket_count) >= 0 &&
              id(forecast_day_bucket_count) <= 4 &&
              std::isfinite(id(forecast_day_sum)) &&
              id(forecast_day_sum) >= 0.0f &&
              id(forecast_day_sum) <=
                  100.0f * id(forecast_day_bucket_count) &&
              (id(forecast_day_bucket_count) == 0 ||
               id(forecast_day_key) > 0);
          if (!partial_day_valid) {
            ESP_LOGW("forecast", "Discarded inconsistent partial forecast day");
            id(forecast_day_sum) = 0.0f;
            id(forecast_day_bucket_count) = 0;
            id(forecast_day_key) = -1;
          }
          id(forecast_current_rate) = -1.0f;
          id(forecast_current_days) = 0.0f;
          id(forecast_current_decline) = 0.0f;
          id(forecast_current_mad) = 0.0f;
          id(forecast_current_model_valid) = false;

          if (n < 2) {
            return;
          }

          const float observed_days = static_cast<float>(
              id(forecast_daily_days)[n - 1] - id(forecast_daily_days)[0]);
          id(forecast_current_days) = observed_days;
          if (observed_days <= 0.0f) {
            return;
          }

          std::array<float,
                     (${forecast_daily_history_size} *
                      (${forecast_daily_history_size} - 1)) / 2> slopes{};
          int slope_count = 0;
          for (int i = 0; i < n - 1; i++) {
            for (int j = i + 1; j < n; j++) {
              const int32_t elapsed =
                  id(forecast_daily_days)[j] - id(forecast_daily_days)[i];
              if (elapsed > 0) {
                slopes[slope_count++] =
                    (id(forecast_daily_levels)[j] -
                     id(forecast_daily_levels)[i]) /
                    static_cast<float>(elapsed);
              }
            }
          }
          if (slope_count == 0) {
            return;
          }
          std::sort(slopes.begin(), slopes.begin() + slope_count);
          const float slope = slope_count % 2 == 1
                                  ? slopes[slope_count / 2]
                                  : (slopes[slope_count / 2 - 1] +
                                     slopes[slope_count / 2]) /
                                        2.0f;
          const float rate = -slope;
          id(forecast_current_rate) = rate;
          id(forecast_current_decline) = rate * observed_days;

          // The Theil-Sen slope is resistant to isolated daily surface shifts.
          // Median absolute residual provides a small, understandable quality
          // gate without assuming normally distributed measurements.
          std::array<float, ${forecast_daily_history_size}> intercepts{};
          for (int i = 0; i < n; i++) {
            intercepts[i] = id(forecast_daily_levels)[i] -
                            slope * id(forecast_daily_days)[i];
          }
          std::sort(intercepts.begin(), intercepts.begin() + n);
          const float intercept = n % 2 == 1
                                      ? intercepts[n / 2]
                                      : (intercepts[n / 2 - 1] +
                                         intercepts[n / 2]) /
                                            2.0f;
          std::array<float, ${forecast_daily_history_size}> residuals{};
          for (int i = 0; i < n; i++) {
            const float expected =
                intercept + slope * id(forecast_daily_days)[i];
            residuals[i] =
                fabsf(id(forecast_daily_levels)[i] - expected);
          }
          std::sort(residuals.begin(), residuals.begin() + n);
          const float mad = n % 2 == 1
                                ? residuals[n / 2]
                                : (residuals[n / 2 - 1] +
                                   residuals[n / 2]) /
                                      2.0f;
          id(forecast_current_mad) = mad;

          id(forecast_current_model_valid) =
              n >= 7 && observed_days >= ${forecast_minimum_days} &&
              rate >= ${forecast_minimum_rate_per_day} &&
              id(forecast_current_decline) >=
                  ${forecast_minimum_decline_percent} &&
              mad <= ${forecast_maximum_mad_percent};

  - id: forecast_evaluate
    mode: restart
    then:
      - lambda: |-
          float days_remaining = NAN;
          std::string status;
          std::string details;
          std::string confidence = "Unavailable";

          const bool sensor_fault_active =
              id(sensor_fault).has_state() && id(sensor_fault).state;
          const bool calibration_required_active =
              id(calibration_required).has_state() &&
              id(calibration_required).state;
          const bool level_valid =
              id(salt_level).has_state() && std::isfinite(id(salt_level).state);

          if (id(salt_status).has_state() &&
              id(salt_status).state == "Initializing") {
            status = "Initializing";
            details = "Starting forecast";
          } else if (sensor_fault_active) {
            status = "Sensor Fault";
            details = "Waiting for valid readings";
          } else if (calibration_required_active) {
            status = "Calibration Required";
            details = "Calibration required";
          } else if (!level_valid) {
            status = "Waiting for Measurement";
            details = "Waiting for first reading";
          } else {
            const float level = id(salt_level).state;
            const float threshold = id(low_salt_threshold).state;
            if (level <= threshold) {
              days_remaining = 0.0f;
              status = "Low Salt";
              details = "Low threshold reached";
              confidence = "Not Applicable";
            } else if (id(forecast_refill_candidate)) {
              status = "Confirming Refill";
              details = "Checking possible refill";
            } else {
              const bool historical_valid =
                  id(forecast_historical_rate) >=
                  ${forecast_minimum_rate_per_day};
              const bool current_valid = id(forecast_current_model_valid);
              float effective_rate = -1.0f;
              if (historical_valid && current_valid) {
                const float current_weight =
                    std::min(28.0f, id(forecast_current_days));
                constexpr float prior_weight = 14.0f;
                effective_rate =
                    (id(forecast_historical_rate) * prior_weight +
                     id(forecast_current_rate) * current_weight) /
                    (prior_weight + current_weight);
              } else if (current_valid) {
                effective_rate = id(forecast_current_rate);
              } else if (historical_valid) {
                effective_rate = id(forecast_historical_rate);
              }

              if (effective_rate >= ${forecast_minimum_rate_per_day}) {
                days_remaining =
                    ceilf((level - threshold) / effective_rate);
                status = "Available";
                if (current_valid) {
                  const int evidence_days = std::max(
                      0, static_cast<int>(lroundf(id(forecast_current_days))));
                  details = "Based on " + std::to_string(evidence_days) +
                            " days of data";
                } else {
                  details = "Based on previous refill cycle";
                }

                const float historical_cv =
                    historical_valid && id(forecast_historical_rate) > 0.0f
                        ? sqrtf(std::max(
                              0.0f, id(forecast_historical_variance))) /
                              id(forecast_historical_rate)
                        : 99.0f;
                if (current_valid && id(forecast_current_days) >= 21.0f &&
                    id(forecast_current_mad) <= 1.5f &&
                    (id(forecast_completed_cycles) >= 1 ||
                     id(forecast_current_decline) >= 10.0f) &&
                    historical_cv <= 0.60f) {
                  confidence = "High";
                } else if ((current_valid &&
                            id(forecast_current_days) >= 12.0f &&
                            id(forecast_current_mad) <= 3.0f) ||
                           (id(forecast_completed_cycles) >= 2 &&
                            historical_cv <= 0.75f)) {
                  confidence = "Medium";
                } else {
                  confidence = "Low";
                }
              } else if (id(forecast_daily_count) >= 7 &&
                         id(forecast_current_days) >=
                             ${forecast_minimum_days}) {
                status = "Insufficient Change";
                details = id(forecast_current_mad) >
                                  ${forecast_maximum_mad_percent}
                              ? "Readings are too inconsistent"
                              : "Not enough salt usage yet";
              } else if (!id(homeassistant_time).now().is_valid()) {
                status = "Waiting for Time";
                details = "Waiting for date and time";
              } else {
                status = "Learning";
                const int collected_days = std::max(
                    0, std::min(id(forecast_daily_count), 7));
                details = std::to_string(collected_days) +
                          " of 7 days collected";
              }
            }
          }

          const bool available = std::isfinite(days_remaining);
          if (available) {
            if (!id(estimated_days_until_low_salt).has_state() ||
                !std::isfinite(id(estimated_days_until_low_salt).state) ||
                id(estimated_days_until_low_salt).state != days_remaining) {
              id(estimated_days_until_low_salt).publish_state(days_remaining);
            }
          } else if (!id(estimated_days_until_low_salt).has_state() ||
                     std::isfinite(id(estimated_days_until_low_salt).state)) {
            id(estimated_days_until_low_salt).publish_state(NAN);
          }

          if (!id(forecast_status).has_state() ||
              id(forecast_status).state != status) {
            id(forecast_status).publish_state(status);
          }
          if (!id(forecast_details).has_state() ||
              id(forecast_details).state != details) {
            id(forecast_details).publish_state(details);
          }
          if (!id(forecast_confidence).has_state() ||
              id(forecast_confidence).state != confidence) {
            id(forecast_confidence).publish_state(confidence);
          }

          if (available != id(forecast_was_available)) {
            if (available) {
              ESP_LOGI("forecast",
                       "Forecast available: %.0f days, confidence %s",
                       days_remaining, confidence.c_str());
            } else if (id(forecast_was_available)) {
              ESP_LOGI("forecast", "Forecast unavailable: %s", status.c_str());
            }
            id(forecast_was_available) = available;
          }

  - id: forecast_finalize_bucket
    mode: single
    then:
      - lambda: |-
          auto now = id(homeassistant_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("forecast", "Six-hour bucket skipped: time unavailable");
            id(forecast_bucket_sum) = 0.0f;
            id(forecast_bucket_sample_count) = 0;
            return;
          }

          // At least half of the expected five-minute samples must be valid.
          if (id(forecast_bucket_sample_count) < 36) {
            ESP_LOGW("forecast",
                     "Six-hour bucket skipped: only %d valid samples",
                     id(forecast_bucket_sample_count));
            id(forecast_bucket_sum) = 0.0f;
            id(forecast_bucket_sample_count) = 0;
            return;
          }
          const float bucket_level =
              id(forecast_bucket_sum) /
              static_cast<float>(id(forecast_bucket_sample_count));
          id(forecast_bucket_sum) = 0.0f;
          id(forecast_bucket_sample_count) = 0;

          // A bucket ending at midnight belongs to the UTC day that just
          // ended. UTC is fixed in the time component, so all builds behave
          // identically and daylight-saving changes cannot distort a bucket.
          const int64_t calendar_timestamp =
              static_cast<int64_t>(now.timestamp) +
              static_cast<int64_t>(now.timezone_offset());
          const int32_t bucket_day =
              static_cast<int32_t>((calendar_timestamp - 1) / 86400LL);

          auto append_recent = [&](float value) {
            int count = std::max(
                0, std::min(id(forecast_recent_bucket_count), 4));
            if (count < 4) {
              id(forecast_recent_buckets)[count++] = value;
            } else {
              for (int i = 0; i < 3; i++) {
                id(forecast_recent_buckets)[i] =
                    id(forecast_recent_buckets)[i + 1];
              }
              id(forecast_recent_buckets)[3] = value;
            }
            id(forecast_recent_bucket_count) = count;
          };

          auto recent_median = [&]() -> float {
            const int count = std::max(
                0, std::min(id(forecast_recent_bucket_count), 4));
            if (count == 0) {
              return NAN;
            }
            std::array<float, 4> values = id(forecast_recent_buckets);
            std::sort(values.begin(), values.begin() + count);
            return count % 2 == 1
                       ? values[count / 2]
                       : (values[count / 2 - 1] + values[count / 2]) /
                             2.0f;
          };

          auto learn_completed_cycle = [&]() {
            if (!id(forecast_current_model_valid)) {
              ESP_LOGI("forecast",
                       "Completed cycle not learned: insufficient trustworthy trend");
              return;
            }
            const float rate = id(forecast_current_rate);
            const float evidence =
                std::max(7.0f, std::min(42.0f, id(forecast_current_days)));
            if (id(forecast_historical_rate) <
                ${forecast_minimum_rate_per_day}) {
              id(forecast_historical_rate) = rate;
              id(forecast_historical_variance) = 0.0f;
            } else {
              const float alpha = evidence / (evidence + 28.0f);
              const float previous = id(forecast_historical_rate);
              const float delta = rate - previous;
              id(forecast_historical_rate) =
                  previous + alpha * delta;
              id(forecast_historical_variance) =
                  (1.0f - alpha) *
                  (id(forecast_historical_variance) +
                   alpha * delta * delta);
            }
            if (id(forecast_completed_cycles) < 1000) {
              id(forecast_completed_cycles) += 1;
            }
            ESP_LOGI("forecast",
                     "Learned completed usage cycle at %.3f percentage points/day",
                     rate);
          };

          auto clear_current_cycle = [&]() {
            id(forecast_daily_levels).fill(0.0f);
            id(forecast_daily_days).fill(0);
            id(forecast_daily_count) = 0;
            id(forecast_day_sum) = 0.0f;
            id(forecast_day_bucket_count) = 0;
            id(forecast_day_key) = -1;
            id(forecast_current_rate) = -1.0f;
            id(forecast_current_days) = 0.0f;
            id(forecast_current_decline) = 0.0f;
            id(forecast_current_mad) = 0.0f;
            id(forecast_current_model_valid) = false;
          };

          bool accept_bucket = true;
          if (id(forecast_refill_candidate)) {
            const int32_t candidate_age =
                bucket_day - id(forecast_refill_candidate_day);
            if (id(forecast_refill_candidate_day) <= 0 ||
                candidate_age < 0 || candidate_age > 1) {
              id(forecast_refill_candidate) = false;
              id(forecast_refill_candidate_day) = -1;
              append_recent(bucket_level);
              id(forecast_cycle_low_level) =
                  std::min(id(forecast_cycle_low_level), bucket_level);
              ESP_LOGI("forecast", "Expired stale refill candidate");
            } else if (bucket_level >=
                id(forecast_refill_base) +
                    ${forecast_refill_confirmation_percent}) {
              learn_completed_cycle();
              clear_current_cycle();
              id(forecast_recent_buckets).fill(0.0f);
              id(forecast_recent_bucket_count) = 0;
              append_recent(id(forecast_refill_candidate_level));
              append_recent(bucket_level);
              id(forecast_cycle_low_level) = std::min(
                  id(forecast_refill_candidate_level), bucket_level);
              id(forecast_refill_candidate) = false;
              id(forecast_refill_candidate_day) = -1;
              id(last_recorded_refill_timestamp) = -1;
              id(refill_timestamp_publish_requested) = true;
              ESP_LOGI("forecast",
                       "Salt refill confirmed automatically at %.1f%%",
                       bucket_level);
            } else {
              // Treat an unconfirmed one-bucket rise as surface noise. It is
              // deliberately not admitted into the daily trend.
              id(forecast_refill_candidate) = false;
              id(forecast_refill_candidate_day) = -1;
              append_recent(bucket_level);
              id(forecast_cycle_low_level) =
                  std::min(id(forecast_cycle_low_level), bucket_level);
              ESP_LOGI("forecast", "Refill candidate rejected as transient");
            }
          } else {
            const float recent_baseline = recent_median();
            const float cycle_floor = id(forecast_cycle_low_level);
            float baseline = recent_baseline;
            if (std::isfinite(cycle_floor) && cycle_floor >= 0.0f &&
                cycle_floor <= 100.0f) {
              baseline = std::isfinite(recent_baseline)
                             ? std::min(recent_baseline, cycle_floor)
                             : cycle_floor;
            }
            if (id(forecast_recent_bucket_count) >= 3 &&
                std::isfinite(baseline) &&
                bucket_level >=
                    baseline + ${forecast_refill_candidate_percent}) {
              id(forecast_refill_candidate) = true;
              id(forecast_refill_base) = baseline;
              id(forecast_refill_candidate_level) = bucket_level;
              id(forecast_refill_candidate_day) = bucket_day;
              accept_bucket = false;
              ESP_LOGI("forecast",
                       "Possible salt refill detected; awaiting confirmation");
            } else {
              append_recent(bucket_level);
              id(forecast_cycle_low_level) =
                  std::min(id(forecast_cycle_low_level), bucket_level);
            }
          }

          if (!accept_bucket || id(forecast_refill_candidate)) {
            return;
          }

          auto append_daily = [&](int32_t day, float value) {
            int count = std::max(
                0, std::min(id(forecast_daily_count),
                            ${forecast_daily_history_size}));
            if (count > 0 && day < id(forecast_daily_days)[count - 1]) {
              ESP_LOGW("forecast", "Daily aggregate ignored after clock moved backward");
              return;
            }
            if (count > 0 && day == id(forecast_daily_days)[count - 1]) {
              id(forecast_daily_levels)[count - 1] = value;
              return;
            }
            if (count < ${forecast_daily_history_size}) {
              id(forecast_daily_days)[count] = day;
              id(forecast_daily_levels)[count] = value;
              id(forecast_daily_count) = count + 1;
            } else {
              for (int i = 0; i < ${forecast_daily_history_size} - 1; i++) {
                id(forecast_daily_days)[i] = id(forecast_daily_days)[i + 1];
                id(forecast_daily_levels)[i] =
                    id(forecast_daily_levels)[i + 1];
              }
              id(forecast_daily_days)[${forecast_daily_history_size} - 1] = day;
              id(forecast_daily_levels)[${forecast_daily_history_size} - 1] =
                  value;
            }
          };

          if (id(forecast_day_key) >= 0 &&
              bucket_day > id(forecast_day_key)) {
            if (id(forecast_day_bucket_count) >= 2) {
              append_daily(
                  id(forecast_day_key),
                  id(forecast_day_sum) /
                      static_cast<float>(id(forecast_day_bucket_count)));
            }
            id(forecast_day_sum) = 0.0f;
            id(forecast_day_bucket_count) = 0;
            id(forecast_day_key) = bucket_day;
          } else if (id(forecast_day_key) < 0) {
            id(forecast_day_key) = bucket_day;
          } else if (bucket_day < id(forecast_day_key)) {
            ESP_LOGW("forecast", "Six-hour bucket ignored after clock moved backward");
            return;
          }

          id(forecast_day_sum) += bucket_level;
          id(forecast_day_bucket_count) += 1;

          if (now.hour == 0) {
            if (id(forecast_day_bucket_count) >= 2) {
              append_daily(
                  id(forecast_day_key),
                  id(forecast_day_sum) /
                      static_cast<float>(id(forecast_day_bucket_count)));
            }
            id(forecast_day_sum) = 0.0f;
            id(forecast_day_bucket_count) = 0;
            id(forecast_day_key) = -1;
          }
      - if:
          condition:
            lambda: return id(refill_timestamp_publish_requested);
          then:
            - lambda: id(refill_timestamp_publish_requested) = false;
            - script.execute: forecast_publish_refill_timestamp
      - script.execute: forecast_recalculate_model
      - script.wait: forecast_recalculate_model
      - script.execute: forecast_evaluate

  - id: forecast_record_refill
    mode: single
    then:
      - lambda: |-
          if (id(forecast_current_model_valid)) {
            const float rate = id(forecast_current_rate);
            const float evidence =
                std::max(7.0f, std::min(42.0f, id(forecast_current_days)));
            if (id(forecast_historical_rate) <
                ${forecast_minimum_rate_per_day}) {
              id(forecast_historical_rate) = rate;
              id(forecast_historical_variance) = 0.0f;
            } else {
              const float alpha = evidence / (evidence + 28.0f);
              const float previous = id(forecast_historical_rate);
              const float delta = rate - previous;
              id(forecast_historical_rate) = previous + alpha * delta;
              id(forecast_historical_variance) =
                  (1.0f - alpha) *
                  (id(forecast_historical_variance) +
                   alpha * delta * delta);
            }
            if (id(forecast_completed_cycles) < 1000) {
              id(forecast_completed_cycles) += 1;
            }
          }

          id(forecast_daily_levels).fill(0.0f);
          id(forecast_daily_days).fill(0);
          id(forecast_daily_count) = 0;
          id(forecast_recent_buckets).fill(0.0f);
          id(forecast_recent_buckets)[0] = id(salt_level).state;
          id(forecast_recent_bucket_count) = 1;
          id(forecast_day_sum) = 0.0f;
          id(forecast_day_bucket_count) = 0;
          id(forecast_day_key) = -1;
          id(forecast_refill_candidate) = false;
          id(forecast_refill_candidate_day) = -1;
          id(forecast_refill_base) = 0.0f;
          id(forecast_refill_candidate_level) = 0.0f;
          id(forecast_cycle_low_level) = id(salt_level).state;
          id(forecast_bucket_sum) = 0.0f;
          id(forecast_bucket_sample_count) = 0;
          id(forecast_current_rate) = -1.0f;
          id(forecast_current_days) = 0.0f;
          id(forecast_current_decline) = 0.0f;
          id(forecast_current_mad) = 0.0f;
          id(forecast_current_model_valid) = false;
          id(last_recorded_refill_timestamp) = -1;
          ESP_LOGI("forecast", "Salt refill recorded manually at %.1f%%",
                   id(salt_level).state);
      - script.execute: forecast_publish_refill_timestamp
      - script.execute: forecast_evaluate

  - id: evaluate_state
    mode: restart
    then:
      - lambda: |-
          // ESP-IDF's 64-bit monotonic timer avoids the roughly 49-day wrap of
          // millis(), including when the sensor has never produced a value.
          const uint64_t now_ms =
              static_cast<uint64_t>(esp_timer_get_time()) / 1000ULL;
          const uint64_t measurement_timeout = ${measurement_timeout_ms}ULL;

          const bool initializing =
              !id(has_valid_measurement) && now_ms < measurement_timeout;

          bool fault = false;
          if (!initializing) {
            if (!id(has_valid_measurement)) {
              fault = true;
            } else if ((now_ms - id(last_valid_measurement_ms)) >= measurement_timeout) {
              fault = true;
            } else if (id(consecutive_invalid_readings) >= ${invalid_reading_limit}) {
              fault = true;
            }
          }

          const bool previous_fault =
              id(sensor_fault).has_state() && id(sensor_fault).state;
          if (fault != previous_fault) {
            if (fault) {
              ESP_LOGE("sensor", "Sensor Fault activated");
            } else {
              ESP_LOGI("sensor", "Sensor Fault cleared");
            }
          }
          id(sensor_fault).publish_state(fault);

          if (id(has_valid_measurement)) {
            const float age_seconds =
                static_cast<float>(now_ms - id(last_valid_measurement_ms)) / 1000.0f;
            id(last_valid_measurement_age).publish_state(age_seconds);
          } else {
            id(last_valid_measurement_age).publish_state(NAN);
          }

          // Never leave a stale public distance visible while a fault is active.
          if (fault && id(distance_to_salt).has_state() &&
              std::isfinite(id(distance_to_salt).state)) {
            id(distance_to_salt).publish_state(NAN);
          }

          const float full = id(full_distance).state;
          const float empty = id(empty_distance).state;
          const bool full_finite = std::isfinite(full);
          const bool empty_finite = std::isfinite(empty);
          const int full_tenths = full_finite ? lroundf(full * 10.0f) : 0;
          const int empty_tenths = empty_finite ? lroundf(empty * 10.0f) : 0;
          const bool full_in_range =
              full_finite && full_tenths >= 50 && full_tenths <= 1200;
          const bool empty_in_range =
              empty_finite && empty_tenths >= 50 && empty_tenths <= 1200;
          const int span_tenths = empty_tenths - full_tenths;
          const bool calibration_valid =
              id(full_calibration_completed) &&
              id(empty_calibration_completed) &&
              full_in_range && empty_in_range &&
              full_tenths < empty_tenths &&
              span_tenths >= 100;

          if (calibration_valid) {
            const bool signatures_initialized =
                id(forecast_calibration_full_tenths) != 0 &&
                id(forecast_calibration_empty_tenths) != 0;
            if (signatures_initialized &&
                (id(forecast_calibration_full_tenths) != full_tenths ||
                 id(forecast_calibration_empty_tenths) != empty_tenths)) {
              id(forecast_reset_requested) = true;
            }
            id(forecast_calibration_full_tenths) = full_tenths;
            id(forecast_calibration_empty_tenths) = empty_tenths;
          }

          std::string calibration_message;
          if (!id(full_calibration_completed) &&
              !id(empty_calibration_completed)) {
            calibration_message = "Full and empty calibration required";
          } else if (!id(full_calibration_completed)) {
            calibration_message = "Full calibration required";
          } else if (!id(empty_calibration_completed)) {
            calibration_message = "Empty calibration required";
          } else if (!full_in_range) {
            calibration_message = "Full Distance must be between 5.0 and 120.0 cm";
          } else if (!empty_in_range) {
            calibration_message = "Empty Distance must be between 5.0 and 120.0 cm";
          } else if (full_tenths >= empty_tenths) {
            calibration_message = "Full Distance must be less than Empty Distance";
          } else if (span_tenths < 100) {
            calibration_message = "Calibration span must be at least 10.0 cm";
          } else {
            calibration_message = "Valid";
          }

          if (!id(calibration_details).has_state() ||
              id(calibration_details).state != calibration_message) {
            id(calibration_details).publish_state(calibration_message);
          }

          if (calibration_valid != id(calibration_was_valid)) {
            if (calibration_valid) {
              ESP_LOGI("calibration", "Calibration becomes valid (full %.1f cm, empty %.1f cm)",
                       full, empty);
            } else {
              ESP_LOGW("calibration", "Calibration becomes invalid");
            }
            id(calibration_was_valid) = calibration_valid;
          }

          id(calibration_required).publish_state(!calibration_valid);

          float salt_percent = NAN;
          const float distance = id(distance_to_salt).state;
          if (!fault && calibration_valid &&
              id(distance_to_salt).has_state() && std::isfinite(distance)) {
            const float canonical_full = static_cast<float>(full_tenths) / 10.0f;
            const float canonical_empty = static_cast<float>(empty_tenths) / 10.0f;
            const float span = canonical_empty - canonical_full;
            salt_percent = ((canonical_empty - distance) / span) * 100.0f;
            salt_percent = std::max(0.0f, std::min(100.0f, salt_percent));
            // Compare the same tenth-percent value that Home Assistant shows.
            salt_percent = static_cast<float>(lroundf(salt_percent * 10.0f)) / 10.0f;
          }
          id(salt_level).publish_state(salt_percent);

          bool low = false;
          if (!fault && calibration_valid && std::isfinite(salt_percent)) {
            const int salt_tenths = lroundf(salt_percent * 10.0f);
            const int threshold_tenths =
                lroundf(id(low_salt_threshold).state * 10.0f);
            const int hysteresis_tenths =
                lroundf(${low_salt_hysteresis_percent} * 10.0f);
            const bool was_low = id(low_salt).has_state() && id(low_salt).state;
            if (was_low) {
              // Equality stays low; clear only above threshold + five points.
              low = salt_tenths <= (threshold_tenths + hysteresis_tenths);
            } else {
              // Equality counts as low.
              low = salt_tenths <= threshold_tenths;
            }
          }

          const bool previous_low = id(low_salt).has_state() && id(low_salt).state;
          if (low != previous_low) {
            if (low) {
              ESP_LOGW("salt", "Low Salt activated");
            } else {
              ESP_LOGI("salt", "Low Salt cleared");
            }
          }
          id(low_salt).publish_state(low);

          // Salt Status is a direct priority view of the entities above.
          std::string status;
          if (initializing) {
            status = "Initializing";
          } else if (id(sensor_fault).state) {
            status = "Sensor Fault";
          } else if (id(calibration_required).state) {
            status = "Calibration Required";
          } else if (id(low_salt).state) {
            status = "Low Salt";
          } else {
            status = "Good";
          }

          if (!id(salt_status).has_state() || id(salt_status).state != status) {
            id(salt_status).publish_state(status);
          }
      - if:
          condition:
            lambda: return id(forecast_reset_requested);
          then:
            - lambda: id(forecast_reset_requested) = false;
            - script.execute: forecast_reset_learning
            - script.wait: forecast_reset_learning
      - script.execute: forecast_evaluate

number:
  - platform: template
    name: "Full Distance"
    id: full_distance
    entity_category: config
    unit_of_measurement: "cm"
    device_class: distance
    mode: box
    min_value: 5
    max_value: 120
    step: 0.1
    initial_value: 20
    restore_value: true
    set_action:
      - lambda: |-
          const float canonical = roundf(x * 10.0f) / 10.0f;
          const int canonical_tenths = lroundf(canonical * 10.0f);
          id(forecast_reset_requested) =
              id(forecast_calibration_full_tenths) != 0 &&
              id(forecast_calibration_full_tenths) != canonical_tenths;
          id(forecast_calibration_full_tenths) = canonical_tenths;
          id(full_distance).publish_state(canonical);
          id(full_calibration_completed) = true;
          ESP_LOGI("calibration", "Full calibration captured: %.1f cm", canonical);

          if (!id(empty_calibration_completed)) {
            ESP_LOGW("calibration", "Calibration rejected: Empty calibration is incomplete");
          } else {
            const int full_tenths = canonical_tenths;
            const int empty_tenths = lroundf(id(empty_distance).state * 10.0f);
            if (full_tenths >= empty_tenths) {
              ESP_LOGW("calibration", "Calibration rejected: Full Distance must be less than Empty Distance");
            } else if ((empty_tenths - full_tenths) < 100) {
              ESP_LOGW("calibration", "Calibration rejected: span must be at least 10.0 cm");
            }
          }
      - if:
          condition:
            lambda: return id(forecast_reset_requested);
          then:
            - lambda: id(forecast_reset_requested) = false;
            - script.execute: forecast_reset_learning
            - script.wait: forecast_reset_learning
      - script.execute: evaluate_state

  - platform: template
    name: "Empty Distance"
    id: empty_distance
    entity_category: config
    unit_of_measurement: "cm"
    device_class: distance
    mode: box
    min_value: 5
    max_value: 120
    step: 0.1
    initial_value: 100
    restore_value: true
    set_action:
      - lambda: |-
          const float canonical = roundf(x * 10.0f) / 10.0f;
          const int canonical_tenths = lroundf(canonical * 10.0f);
          id(forecast_reset_requested) =
              id(forecast_calibration_empty_tenths) != 0 &&
              id(forecast_calibration_empty_tenths) != canonical_tenths;
          id(forecast_calibration_empty_tenths) = canonical_tenths;
          id(empty_distance).publish_state(canonical);
          id(empty_calibration_completed) = true;
          ESP_LOGI("calibration", "Empty calibration captured: %.1f cm", canonical);

          if (!id(full_calibration_completed)) {
            ESP_LOGW("calibration", "Calibration rejected: Full calibration is incomplete");
          } else {
            const int full_tenths = lroundf(id(full_distance).state * 10.0f);
            const int empty_tenths = canonical_tenths;
            if (full_tenths >= empty_tenths) {
              ESP_LOGW("calibration", "Calibration rejected: Full Distance must be less than Empty Distance");
            } else if ((empty_tenths - full_tenths) < 100) {
              ESP_LOGW("calibration", "Calibration rejected: span must be at least 10.0 cm");
            }
          }
      - if:
          condition:
            lambda: return id(forecast_reset_requested);
          then:
            - lambda: id(forecast_reset_requested) = false;
            - script.execute: forecast_reset_learning
            - script.wait: forecast_reset_learning
      - script.execute: evaluate_state

  - platform: template
    name: "Low Salt Threshold"
    id: low_salt_threshold
    entity_category: config
    unit_of_measurement: "%"
    mode: box
    min_value: 5
    max_value: 50
    step: 1
    initial_value: 20
    restore_value: true
    set_action:
      - lambda: |-
          id(low_salt_threshold).publish_state(x);
      - script.execute: evaluate_state

button:
  - platform: template
    name: "Set Current Distance as Full"
    id: set_current_distance_as_full
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              return id(has_valid_measurement) &&
                     id(distance_to_salt).has_state() &&
                     std::isfinite(id(distance_to_salt).state) &&
                     id(sensor_fault).has_state() &&
                     !id(sensor_fault).state;
          then:
            - lambda: |-
                ESP_LOGI("calibration", "Set Current Distance as Full accepted at %.1f cm",
                         id(distance_to_salt).state);
            - number.set:
                id: full_distance
                value: !lambda return id(distance_to_salt).state;
          else:
            - logger.log:
                level: WARN
                tag: calibration
                format: "Set Current Distance as Full rejected: no valid filtered distance"

  - platform: template
    name: "Set Current Distance as Empty"
    id: set_current_distance_as_empty
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              return id(has_valid_measurement) &&
                     id(distance_to_salt).has_state() &&
                     std::isfinite(id(distance_to_salt).state) &&
                     id(sensor_fault).has_state() &&
                     !id(sensor_fault).state;
          then:
            - lambda: |-
                ESP_LOGI("calibration", "Set Current Distance as Empty accepted at %.1f cm",
                         id(distance_to_salt).state);
            - number.set:
                id: empty_distance
                value: !lambda return id(distance_to_salt).state;
          else:
            - logger.log:
                level: WARN
                tag: calibration
                format: "Set Current Distance as Empty rejected: no valid filtered distance"

  - platform: template
    name: "Record Salt Refill"
    id: record_salt_refill
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              return id(salt_level).has_state() &&
                     std::isfinite(id(salt_level).state) &&
                     id(sensor_fault).has_state() &&
                     !id(sensor_fault).state &&
                     id(calibration_required).has_state() &&
                     !id(calibration_required).state;
          then:
            - script.execute: forecast_record_refill
          else:
            - logger.log:
                level: WARN
                tag: forecast
                format: "Record Salt Refill rejected: measurement or calibration unavailable"

sensor:
  # Internal raw/filter path. Invalid samples are rejected before the median.
  # The timeout is deliberately last, so its NaN reaches on_value unchanged.
  - platform: vl53l0x
    id: tof_distance
    address: 0x29
    update_interval: 30s
    long_range: true
    internal: true
    filters:
      - multiply: 100.0
      - lambda: |-
          if (!std::isfinite(x) || x < ${sensor_min_cm} || x > ${sensor_max_cm}) {
            if (id(consecutive_invalid_readings) < 1000) {
              id(consecutive_invalid_readings) += 1;
            }
            return {};
          }

          const bool first_valid = !id(has_valid_measurement);
          id(has_valid_measurement) = true;
          id(last_valid_measurement_ms) =
              static_cast<uint64_t>(esp_timer_get_time()) / 1000ULL;
          id(consecutive_invalid_readings) = 0;
          id(sensor_recovery_reboot_attempted) = false;
          id(i2c_missing_observed) = false;
          if (first_valid) {
            ESP_LOGI("sensor", "First valid distance: %.1f cm", x);
          }
          return x;
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - timeout:
          timeout: 180s
          value: !lambda return NAN;
    on_value:
      then:
        - lambda: |-
            if (std::isfinite(x)) {
              id(distance_to_salt).publish_state(x);
            } else {
              id(distance_to_salt).publish_state(NAN);
            }
        - script.execute: evaluate_state

  - platform: template
    name: "Distance to Salt"
    id: distance_to_salt
    unit_of_measurement: "cm"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Salt Level"
    id: salt_level
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Estimated Days Until Low Salt"
    id: estimated_days_until_low_salt
    icon: mdi:calendar-clock
    unit_of_measurement: "d"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Last Recorded Refill"
    id: last_recorded_refill
    icon: mdi:calendar-refresh
    device_class: timestamp
    accuracy_decimals: 0
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "Last Valid Measurement Age"
    id: last_valid_measurement_age
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    name: "Low Salt"
    id: low_salt
    device_class: problem

  - platform: template
    name: "Sensor Fault"
    id: sensor_fault
