# Public bootstrap build used only to create the ESP Web Tools factory image.
# The production saltwatch.yaml adds encrypted API access after adoption.
packages:
  saltwatch: !include saltwatch-core.yaml

esphome:
  name_add_mac_suffix: true

api:
  # Advertise encryption support so Device Builder generates a unique key when
  # the device is adopted. No key is embedded in the public factory image.
  encryption:

dashboard_import:
  package_import_url: github://thomasgregg/saltwatch/saltwatch-core.yaml@main
  import_full_config: false

improv_serial:
  next_url: https://thomasgregg.github.io/saltwatch/

provisioning:
  timeout: 10min
