# Optional Home Assistant package for SaltWatch forecasting.
#
# Assumes the default ESPHome entity IDs. If Home Assistant assigned different
# IDs, replace the four saltwatch_* source entity IDs below before reloading.

sensor:
  # Smooth short-term surface movement, then retain one representative value
  # per hour so the 14-day statistics buffer stays small and understandable.
  - platform: filter
    name: "SaltWatch Forecast Level"
    unique_id: saltwatch_forecast_level
    entity_id: sensor.saltwatch_salt_level
    filters:
      - filter: time_simple_moving_average
        window_size: "06:00:00"
        precision: 2
      - filter: time_throttle
        window_size: "01:00:00"

  - platform: statistics
    name: "SaltWatch 14-Day Level Change Per Second"
    unique_id: saltwatch_14_day_level_change_per_second
    entity_id: sensor.saltwatch_forecast_level
    state_characteristic: change_second
    max_age:
      days: 14
    sampling_size: 512
    precision: 8

template:
  - sensor:
      - name: "SaltWatch Estimated Days Until Low Salt"
        unique_id: saltwatch_estimated_days_until_low_salt
        icon: mdi:calendar-clock
        device_class: duration
        state_class: measurement
        unit_of_measurement: "d"
        availability: >-
          {% set level = states('sensor.saltwatch_salt_level') %}
          {% set threshold = states('number.saltwatch_low_salt_threshold') %}
          {% set change = states('sensor.saltwatch_14_day_level_change_per_second') %}
          {% set coverage = state_attr(
              'sensor.saltwatch_14_day_level_change_per_second',
              'age_coverage_ratio') | float(0) %}
          {% set source_valid = state_attr(
              'sensor.saltwatch_14_day_level_change_per_second',
              'source_value_valid') == true %}
          {% set base_valid =
              is_number(level) and is_number(threshold) and
              is_state('binary_sensor.saltwatch_sensor_fault', 'off') and
              is_state('binary_sensor.saltwatch_calibration_required', 'off') %}
          {% set already_low = base_valid and
              level | float <= threshold | float %}
          {% set daily_change = change | float(0) * 86400 %}
          {{ base_valid and (already_low or
              (is_number(change) and source_valid and coverage >= 0.5 and
               daily_change < -0.05)) }}
        state: >-
          {% set level = states('sensor.saltwatch_salt_level') | float %}
          {% set threshold = states('number.saltwatch_low_salt_threshold') | float %}
          {% if level <= threshold %}
            0
          {% else %}
            {% set daily_change =
                states('sensor.saltwatch_14_day_level_change_per_second') |
                float * 86400 %}
            {{ ((level - threshold) / (-daily_change)) | round(0, 'ceil') | int }}
          {% endif %}
