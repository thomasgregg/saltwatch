blueprint:
  name: SaltWatch alerts
  description: >-
    Sends prioritized notifications for SaltWatch status changes and the
    device-native days-until-low forecast. Recovery notifications and one
    persistent low-salt reminder are optional. Select all entities from the
    same SaltWatch device.
  domain: automation
  author: SaltWatch
  homeassistant:
    min_version: 2024.10.0
  input:
    required:
      name: Required setup
      icon: mdi:bell-cog-outline
      description: Notification destination and entities from one SaltWatch device.
      input:
        notification_target:
          name: Notification target
          description: Phone or other Home Assistant notify entity.
          selector:
            entity:
              filter:
                domain: notify
        salt_status_entity:
          name: Salt Status
          description: Controls prioritized fault, calibration, and low-salt alerts.
          selector:
            entity:
              filter:
                integration: esphome
                domain: sensor
        salt_level_entity:
          name: Salt Level
          selector:
            entity:
              filter:
                integration: esphome
                domain: sensor
        calibration_details_entity:
          name: Calibration Details
          selector:
            entity:
              filter:
                integration: esphome
                domain: sensor
        forecast_entity:
          name: Estimated Days Until Low Salt
          description: Built into SaltWatch firmware; no package is required.
          selector:
            entity:
              filter:
                integration: esphome
                domain: sensor
    notification_options:
      name: Notification options
      icon: mdi:bell-outline
      description: Choose which useful follow-up notifications should be sent.
      input:
        send_forecast_notifications:
          name: Send forecast warnings
          default: true
          selector:
            boolean:
        forecast_notice_days:
          name: Forecast warning
          description: Notify when the estimate first appears or crosses this many days.
          default: 7
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: days
              mode: box
        send_recovery_notifications:
          name: Send recovery notifications
          default: true
          selector:
            boolean:
        send_low_salt_reminder:
          name: Send one low-salt reminder
          description: Send one follow-up if Low Salt remains active continuously.
          default: false
          selector:
            boolean:
        low_salt_reminder_delay:
          name: Low-salt reminder delay
          description: How long Low Salt must remain active before the one-time reminder.
          default:
            days: 3
          selector:
            duration:
    advanced:
      name: Advanced
      icon: mdi:tune
      description: Timing used to ignore very brief status or forecast changes.
      collapsed: true
      input:
        problem_delay:
          name: Confirmation time
          description: Applied to new problems and forecast warnings, not recoveries.
          default:
            minutes: 2
          selector:
            duration:

variables:
  salt_status_entity: !input salt_status_entity
  salt_level_entity: !input salt_level_entity
  calibration_details_entity: !input calibration_details_entity
  forecast_entity: !input forecast_entity
  forecast_notice_days: !input forecast_notice_days
  send_recovery_notifications: !input send_recovery_notifications
  send_low_salt_reminder: !input send_low_salt_reminder
  device_name: >-
    {%- set selected_device = device_id(salt_status_entity) -%}{{-
      (device_attr(selected_device, 'name_by_user') or
       device_attr(selected_device, 'name') or 'SaltWatch')
      if selected_device else 'SaltWatch'
    -}}

trigger_variables:
  forecast_entity_for_trigger: !input forecast_entity
  forecast_notice_days_for_trigger: !input forecast_notice_days
  salt_status_entity_for_trigger: !input salt_status_entity
  salt_level_entity_for_trigger: !input salt_level_entity

triggers:
  - trigger: state
    id: sensor_fault
    entity_id: !input salt_status_entity
    to: "Sensor Fault"
    for: !input problem_delay
  - trigger: state
    id: calibration_required
    entity_id: !input salt_status_entity
    to: "Calibration Required"
    for: !input problem_delay
  - trigger: state
    id: low_salt
    entity_id: !input salt_status_entity
    to: "Low Salt"
    for: !input problem_delay
  - trigger: template
    id: forecast
    enabled: !input send_forecast_notifications
    value_template: >-
      {% set days = states(forecast_entity_for_trigger) %}
      {{ is_state(salt_status_entity_for_trigger, 'Good') and
         is_number(states(salt_level_entity_for_trigger)) and
         is_number(days) and days | float > 0 and
         days | float <= forecast_notice_days_for_trigger | float }}
    for: !input problem_delay
  - trigger: state
    id: recovered
    entity_id: !input salt_status_entity
    to: "Good"
  - trigger: state
    id: low_salt_reminder
    enabled: !input send_low_salt_reminder
    entity_id: !input salt_status_entity
    to: "Low Salt"
    for: !input low_salt_reminder_delay

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: low_salt
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: refill salt"
              message: >-
                Salt is at {{ states(salt_level_entity) }}%. Refill the
                water-softener brine tank.
      - conditions:
          - condition: trigger
            id: sensor_fault
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: sensor fault"
              message: >-
                SaltWatch is not receiving a trustworthy distance. Check the
                ToF sensor, Grove cable, salt dust, condensation, and target range.
      - conditions:
          - condition: trigger
            id: calibration_required
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: calibration required"
              message: >-
                {% set details = states(calibration_details_entity) %}
                {% if details not in ['unknown', 'unavailable', 'none', ''] %}
                  {{ details }}. Salt Level remains unavailable until calibration is valid.
                {% else %}
                  Calibration is incomplete or invalid. Salt Level remains unavailable
                  until calibration is valid.
                {% endif %}
      - conditions:
          - condition: trigger
            id: forecast
          - condition: template
            value_template: >-
              {{ is_state(salt_status_entity, 'Good') and
                 is_number(states(salt_level_entity)) and
                 is_number(states(forecast_entity)) and
                 states(forecast_entity) | float > 0 and
                 states(forecast_entity) | float <= forecast_notice_days | float }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: salt may run low soon"
              message: >-
                Based on the recent trend, SaltWatch estimates about
                {{ states(forecast_entity) }} days until the configured low-salt
                threshold. This is an estimate; check the tank before relying on it.
      - conditions:
          - condition: trigger
            id: low_salt_reminder
          - condition: template
            value_template: >-
              {{ send_low_salt_reminder and
                 is_state(salt_status_entity, 'Low Salt') and
                 is_number(states(salt_level_entity)) }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: salt is still low"
              message: >-
                Low Salt is still active at {{ states(salt_level_entity) }}%.
                Refill the water-softener brine tank.
      - conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: >-
              {{ send_recovery_notifications and trigger.from_state is not none and
                 trigger.from_state.state == 'Low Salt' and
                 is_number(states(salt_level_entity)) }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: condition cleared"
              message: >-
                The low-salt warning has cleared. Salt Level is
                {{ states(salt_level_entity) }}%.
      - conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: >-
              {{ send_recovery_notifications and trigger.from_state is not none and
                 trigger.from_state.state == 'Sensor Fault' }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: sensor recovered"
              message: "Valid distance measurements have resumed."
      - conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: >-
              {{ send_recovery_notifications and trigger.from_state is not none and
                 trigger.from_state.state == 'Calibration Required' and
                 is_number(states(salt_level_entity)) }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notification_target
            data:
              title: "{{ device_name }}: calibration valid"
              message: "Calibration is valid and Salt Level is available."

mode: queued
max: 10
